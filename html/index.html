<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Dominó Boricua</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="ambient"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>

        <div id="stage">
            <header class="topbar glass">
                <div class="brand">
                    <span class="flag" data-icon="flag"></span>
                    <div class="brand-text">
                        <h1>Dominó <em>Boricua</em></h1>
                        <small id="tableLabel">La mesa del barrio</small>
                    </div>
                </div>
                <div class="phase" id="phaseChip"></div>
                <div class="top-actions">
                    <button class="icon-btn" id="btnRules" title="Reglas">?</button>
                    <button class="icon-btn" id="btnSound" title="Sonido"></button>
                    <button class="icon-btn close" id="btnClose" title="Cerrar (ESC)">&times;</button>
                </div>
            </header>

            <main class="layout">
                <section class="mesa glass" id="mesa">
                    <div class="mesa-star" data-icon="star"></div>
                    <div id="lobby" class="view"></div>
                    <div id="game" class="view">
                        <div id="board"></div>
                        <div id="plates"></div>
                        <div id="dock" class="glass"><div id="hand"></div></div>
                    </div>
                    <div id="bubbles"></div>
                    <div id="shout"></div>
                    <div id="overlay"></div>
                </section>

                <aside class="side">
                    <div id="score"></div>
                    <div class="side-panel" id="sidePanel"></div>
                </aside>
            </main>

            <div class="modal" id="rules"></div>
        </div>

        <div id="adminLayer"></div>
        <div id="placementHud" class="glass"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
